name: all_music
description: "All Music - 本地音源音乐播放器"
publish_to: 'none'
version: 1.0.2

environment:
  sdk: ^3.12.2
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio
  just_audio: ^0.9.43
  audio_service: ^0.18.17
  audio_session: ^0.1.25

  # State Management
  flutter_riverpod: ^2.6.1

  # Network
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1

  # JavaScript engine (source scripts) — 自带原生库，无需 libjsc.so
  # 使用 vendored 本地副本：官方 0.1.1 的 CMakeLists 漏链 Android liblog，
  # 且 build.gradle 未设 Kotlin jvmTarget，已在 local_plugins 内修复。
  quickjs_engine:
    path: local_plugins/quickjs_engine

  # Navigation
  go_router: ^14.8.1

  # Account login (webview login + weapi crypto)
  webview_flutter: ^4.10.0
  pointycastle: ^3.9.1

  # Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Utilities
  uuid: ^4.5.1

  # Screen adaptation (multi-device)
  flutter_screenutil: ^5.9.3

  # Permissions (local file scanning)
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"  
  background_color: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/scripts/crypto-js.js
    # 打包 pubspec.yaml 供设置页读取应用版本号
    - pubspec.yaml
