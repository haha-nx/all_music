name: all_music
description: "All Music - 本地音源音乐播放器"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio
  just_audio: ^0.9.43
  audio_service: ^0.18.17
  audio_session: ^0.1.25

  # State Management
  flutter_riverpod: ^2.6.1

  # Network
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1

  # JavaScript engine (source scripts)
  flutter_js: ^0.8.7

  # Navigation
  go_router: ^14.8.1

  # Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Utilities
  uuid: ^4.5.1

  # Permissions (local file scanning)
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/scripts/sixyin_latest.js
